services:
  surf:
    build:
      context: .
      args:
        SURF_VERSION: ${SURF_VERSION:?set SURF_VERSION}
        SURF_ARCH: ${SURF_ARCH:-amd64}
        SURF_ARCHIVE_SHA256: ${SURF_ARCHIVE_SHA256:?set SURF_ARCHIVE_SHA256}
    restart: unless-stopped
    environment:
      SURF_PASSWORD: ${SURF_PASSWORD:?set SURF_PASSWORD}
      PORT: 8080
      SURF_HOME: /data/surf
      PROFILE: /data/profile
      DOWNLOADS: /data/downloads
      UPLOADS: /data/uploads
      CHROME: /usr/bin/chromium
    expose:
      - "8080"
    shm_size: "1g"
    volumes:
      - surf_runtime:/data/surf
      - surf_profile:/data/profile
      - surf_downloads:/data/downloads
      - surf_uploads:/data/uploads
    networks:
      - web

volumes:
  surf_runtime:
    name: ${SURF_RUNTIME_VOLUME:-surf_runtime}
  surf_profile:
    name: ${SURF_PROFILE_VOLUME:-surf_profile}
  surf_downloads:
    name: ${SURF_DOWNLOADS_VOLUME:-surf_downloads}
  surf_uploads:
    name: ${SURF_UPLOADS_VOLUME:-surf_uploads}

networks:
  web:
    external: true
