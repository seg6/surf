[workspace]
resolver = "3"
members = [
    "crates/surf-client",
    "crates/surf-client-app",
    "crates/surf-core",
    "crates/surf-core-sys",
    "crates/surf-media",
    "crates/surf-protocol",
    "crates/surf-session",
]

[workspace.package]
version = "0.15.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/seg6/surf"

[workspace.dependencies]
base64 = "0.22.1"
bytes = "1.11.1"
cpal = "0.18.2"
directories = "6.0.0"
glow = "0.17.0"
gtk = { package = "gtk4", version = "0.11.4" }
libc = "0.2.177"
ffmpeg-the-third = { version = "6.0.0", default-features = false, features = ["format"] }
futures-util = "0.3.31"
hex = "0.4.3"
mdns-sd = { version = "0.21.1", default-features = false }
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "multipart", "rustls", "stream"] }
rsa = { version = "0.9.8", features = ["sha2"] }
rustls = { version = "0.23.40", default-features = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", features = ["oid"] }
surf-core = { path = "crates/surf-core" }
surf-core-sys = { path = "crates/surf-core-sys" }
surf-media = { path = "crates/surf-media" }
surf-protocol = { path = "crates/surf-protocol" }
surf-session = { path = "crates/surf-session" }
surf-client-app = { path = "crates/surf-client-app" }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = { version = "2.5.7", features = ["serde"] }
