<!doctype html>
<meta charset="utf-8">
<title>Surf AV sync check</title>
<style>
html,body{margin:0;width:100%;height:100%;background:black;overflow:hidden}
body{display:grid;place-items:center}button{font:24px sans-serif;padding:24px}
</style>
<button>Start sync check</button>
<script>
document.querySelector('button').onclick=async function(){
  const audio=new AudioContext();await audio.resume();this.remove();
  const start=audio.currentTime+.5;
  for(let i=0;i<5;i++){
    const oscillator=audio.createOscillator(),gain=audio.createGain();
    oscillator.frequency.value=1000;gain.gain.value=.35;
    oscillator.connect(gain).connect(audio.destination);
    oscillator.start(start+i*2);oscillator.stop(start+i*2+.08);
  }
  function draw(){
    const t=audio.currentTime-start;
    document.documentElement.style.background=t>=0&&t<8.08&&t%2<.08?'white':'black';
    document.body.style.background='transparent';
    if(t<9)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
};
</script>
