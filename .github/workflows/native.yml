name: Native client

on:
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "Makefile"
      - "PROTOCOL_VERSION"
      - "VERSION"
      - "native/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native.yml"
      - "Makefile"
      - "PROTOCOL_VERSION"
      - "VERSION"
      - "native/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Universal package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated native metadata
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)" \
          PROTOCOL_VERSION="$(tr -d '[:space:]' < PROTOCOL_VERSION)" \
            native/client/render-versioned-files.sh
          git diff --exit-code -- native/client/control native/client/Resources/Info.plist

      - name: Download native SDK
        run: make native-sdk

      - name: Build native build environment
        run: docker build -t surf-buildenv native/buildenv

      - name: Build and verify native package
        run: make native-package

      - uses: actions/upload-artifact@v4
        with:
          name: surf-native-deb
          path: native/client/packages/*.deb
          if-no-files-found: error
