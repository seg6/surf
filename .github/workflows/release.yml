name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    name: Native package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated native metadata
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)" \
          PROTOCOL_VERSION="$(tr -d '[:space:]' < PROTOCOL_VERSION)" \
            native/client/render-versioned-files.sh
          git diff --exit-code -- native/client/control native/client/Resources/Info.plist

      - name: Download native SDK
        run: make native-sdk

      - name: Build native build environment
        run: docker build -t surf-buildenv native/buildenv

      - name: Build native package
        run: make native-package

      - uses: actions/upload-artifact@v4
        with:
          name: surf-native-deb
          path: native/client/packages/*.deb
          if-no-files-found: error

  packages:
    name: Surf ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: native
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Free Intel macOS package space
        if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf /usr/local/share/dotnet
          rm -rf "$HOME/Library/Android" "$HOME/.gradle" "$HOME/.nuget"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: surf-native-deb
          path: dist/native

      - name: Prepare Linux AppImage tooling
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          curl -fL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Prepare Windows installer tooling
        if: matrix.goos == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Surf package
        shell: bash
        run: |
          client_deb="$(find dist/native -name '*.deb' -type f -print -quit)"
          test -n "$client_deb"
          make surf-dist SURF_GOOS=${{ matrix.goos }} SURF_GOARCH=${{ matrix.goarch }} CLIENT_DEB="$client_deb"

      - name: Verify package
        shell: bash
        run: |
          test -n "$(find dist -type f \( -name surf -o -name surf.exe \) -print -quit)"
          test -z "$(find dist -type f \( -name surf-desktop -o -name surf-backend -o -name surf-desktop.exe -o -name surf-backend.exe \) -print -quit)"
          case "${{ matrix.goos }}" in
            linux)
              if [ "${{ matrix.goarch }}" = "amd64" ]; then
                test -n "$(find dist -name '*.AppImage' -type f -print -quit)"
              fi
              ;;
            windows) test -n "$(find dist -name '*-setup.exe' -type f -print -quit)" ;;
            darwin)
              test -n "$(find dist -name '*.dmg' -type f -print -quit)"
              codesign --verify --deep --strict dist/Surf.app
              test "$(otool -l dist/Surf.app/Contents/MacOS/surf |
                awk '$1 == "minos" { print $2; exit }')" = "12.0"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: surf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/surf-*.tar.gz
            dist/surf-*.zip
            dist/surf-*.AppImage
            dist/surf-*.dmg
            dist/surf-*-setup.exe
          if-no-files-found: error

  release:
    name: Build release
    runs-on: ubuntu-latest
    needs: [native, packages]
    steps:
      - uses: actions/checkout@v4

      - name: Release metadata
        id: meta
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          protocol_version="$(tr -d '[:space:]' < PROTOCOL_VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION is required" >&2
            exit 1
          fi
          if [ -z "$protocol_version" ]; then
            echo "PROTOCOL_VERSION is required" >&2
            exit 1
          fi
          tag="v$version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "git tag ${GITHUB_REF_NAME} does not match VERSION $version" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "protocol_version=${protocol_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify generated native metadata
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)" \
          PROTOCOL_VERSION="$(tr -d '[:space:]' < PROTOCOL_VERSION)" \
            native/client/render-versioned-files.sh
          git diff --exit-code -- native/client/control native/client/Resources/Info.plist

      - uses: actions/download-artifact@v4
        with:
          pattern: surf-*
          path: dist/packages
          merge-multiple: true

      - name: Generate update manifest
        shell: bash
        run: |
          client_deb="$(find dist/packages -name '*.deb' -type f -print -quit)"
          test -n "$client_deb"
          cd backend
          go run ./tools/updatemanifest ../dist/packages "../$client_deb" \
            "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.protocol_version }}" ../update.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Surf ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            Native iOS package and unified Surf executables for Linux,
            Windows, and macOS are attached. Launch `surf` for the desktop app
            or use `surf serve` for the backend alone.
          files: |
            dist/packages/surf-*.tar.gz
            dist/packages/surf-*.zip
            dist/packages/surf-*.AppImage
            dist/packages/surf-*.dmg
            dist/packages/surf-*-setup.exe
            dist/packages/*.deb
            update.json
