name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop app ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build desktop package
        shell: bash
        run: make desktop-dist BACKEND_GOOS=${{ matrix.goos }} BACKEND_GOARCH=${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: surf-desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/surf-desktop-*.tar.gz
            dist/surf-desktop-*.zip
          if-no-files-found: error

  release:
    name: Build release
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Release metadata
        id: meta
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          protocol_version="$(tr -d '[:space:]' < PROTOCOL_VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION is required" >&2
            exit 1
          fi
          if [ -z "$protocol_version" ]; then
            echo "PROTOCOL_VERSION is required" >&2
            exit 1
          fi
          tag="v$version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "git tag ${GITHUB_REF_NAME} does not match VERSION $version" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "protocol_version=${protocol_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify generated native metadata
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)" \
          PROTOCOL_VERSION="$(tr -d '[:space:]' < PROTOCOL_VERSION)" \
            native/client/render-versioned-files.sh
          git diff --exit-code -- native/client/control native/client/Resources/Info.plist

      - name: Test backend
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Build backend packages
        run: make backend-dist-all

      - uses: actions/upload-artifact@v4
        with:
          name: surf-backend-${{ steps.meta.outputs.tag }}
          path: |
            dist/surf-backend-*.tar.gz
            dist/surf-backend-*.zip

      - name: Download native SDK
        run: make native-sdk

      - name: Build native build environment
        run: docker build -t surf-buildenv native/buildenv

      - name: Build native package
        run: make native-package

      - uses: actions/upload-artifact@v4
        with:
          name: surf-native-${{ steps.meta.outputs.tag }}
          path: native/client/packages/*.deb

      - uses: actions/download-artifact@v4
        with:
          pattern: surf-desktop-*
          path: dist/desktop
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Surf ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            Native iOS package, desktop tray apps, and standalone backend
            archives for Linux, Windows, and macOS are attached.
          files: |
            native/client/packages/*.deb
            dist/desktop/surf-desktop-*.tar.gz
            dist/desktop/surf-desktop-*.zip
            dist/surf-backend-*.tar.gz
            dist/surf-backend-*.zip
