name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# One Linux runner builds the universal native client and every cgo-free desktop
# target from the same signed tag, verifies the complete package set, and
# publishes it without intermediate Actions artifacts.
jobs:
  release:
    name: Build and publish ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Fetch and verify signed release source
        shell: bash
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }
          for command in curl file gh git jq make sha256sum tar unzip; do
            command -v "$command" >/dev/null || {
              echo "required command is unavailable: $command" >&2
              exit 1
            }
          done

          tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          tag_object_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_object_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
          test "$tag_object_type" = "tag" || {
            echo "$RELEASE_TAG is not an annotated tag" >&2
            exit 1
          }

          tag_json="$(gh api "repos/$GH_REPO/git/tags/$tag_object_sha")"
          tag_name="$(jq -r '.tag' <<< "$tag_json")"
          tag_target_type="$(jq -r '.object.type' <<< "$tag_json")"
          tag_commit="$(jq -r '.object.sha' <<< "$tag_json")"
          tag_verified="$(jq -r '.verification.verified' <<< "$tag_json")"
          tag_verification_reason="$(jq -r '.verification.reason' <<< "$tag_json")"
          test "$tag_name" = "$RELEASE_TAG"
          test "$tag_target_type" = "commit" || {
            echo "$RELEASE_TAG does not point directly to a commit" >&2
            exit 1
          }
          test "$tag_verified" = "true" || {
            echo "$RELEASE_TAG signature is not verified: $tag_verification_reason" >&2
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$tag_commit" = "$GITHUB_SHA" || {
              echo "$RELEASE_TAG points to $tag_commit but the workflow received $GITHUB_SHA" >&2
              exit 1
            }
          fi

          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git fetch --force --depth=1 origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$tag_commit"
          test "$(git rev-parse HEAD)" = "$tag_commit"

          version="$(tr -d '[:space:]' < VERSION)"
          protocol_version="$(tr -d '[:space:]' < PROTOCOL_VERSION)"
          test "$RELEASE_TAG" = "v$version" || {
            echo "$RELEASE_TAG does not match VERSION $version" >&2
            exit 1
          }
          test -n "$protocol_version"
          git diff --exit-code
          echo "Verified $RELEASE_TAG at $tag_commit"

      - name: Build and verify universal native package
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          protocol_version="$(tr -d '[:space:]' < PROTOCOL_VERSION)"
          VERSION="$version" PROTOCOL_VERSION="$protocol_version" \
            native/client/render-versioned-files.sh
          git diff --exit-code -- \
            native/client/control native/client/Resources/Info.plist

          make native-sdk
          docker build -t surf-buildenv native/buildenv
          make native-package

          mkdir -p dist/native
          mapfile -t client_debs < <(find native/client/packages \
            -name "space.seg6.surf_${version}-*_iphoneos-arm.deb" -type f -print)
          test "${#client_debs[@]}" -eq 1 || {
            echo "expected exactly one native client package" >&2
            exit 1
          }
          test -s "${client_debs[0]}"
          install -m 0644 "${client_debs[0]}" dist/native/

      - name: Prepare cross-platform packaging tools
        shell: bash
        run: |
          set -euo pipefail

          required_go="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          test -n "$required_go"
          if ! command -v go >/dev/null 2>&1 || \
              [ "$(go env GOVERSION 2>/dev/null || true)" != "go$required_go" ]; then
            go_filename="go${required_go}.linux-amd64.tar.gz"
            go_archive="$RUNNER_TEMP/$go_filename"
            go_checksum="$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' |
              jq -r --arg filename "$go_filename" '
                .[] | .files[] | select(.filename == $filename) | .sha256
              ')"
            [[ "$go_checksum" =~ ^[0-9a-f]{64}$ ]] || {
              echo "could not resolve checksum for $go_filename" >&2
              exit 1
            }
            curl -fL "https://go.dev/dl/$go_filename" -o "$go_archive"
            printf '%s  %s\n' "$go_checksum" "$go_archive" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/surf-go"
            tar -xzf "$go_archive" -C "$RUNNER_TEMP/surf-go" \
              --strip-components=1
            export PATH="$RUNNER_TEMP/surf-go/bin:$PATH"
            echo "$RUNNER_TEMP/surf-go/bin" >> "$GITHUB_PATH"
          fi
          test "$(go env GOVERSION)" = "go$required_go"

          appimagetool="$RUNNER_TEMP/appimagetool"
          curl -fL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$appimagetool"
          chmod +x "$appimagetool"
          echo "APPIMAGETOOL=$appimagetool" >> "$GITHUB_ENV"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis
          command -v makensis
          go version
          makensis -VERSION

      - name: Build and verify every desktop package
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          client_deb="$(find dist/native -name '*.deb' -type f -print -quit)"
          make surf-release-dist CLIENT_DEB="$client_deb"

          expected_assets=(
            "surf-${version}-linux-amd64.tar.gz"
            "surf-${version}-linux-amd64.AppImage"
            "surf-${version}-linux-arm64.tar.gz"
            "surf-${version}-windows-amd64.zip"
            "surf-${version}-windows-amd64-setup.exe"
            "surf-${version}-darwin-amd64.tar.gz"
            "surf-${version}-darwin-arm64.tar.gz"
          )
          for asset in "${expected_assets[@]}"; do
            test -s "dist/$asset" || {
              echo "missing release asset: $asset" >&2
              exit 1
            }
          done
          test "$(find dist -maxdepth 1 -type f -name "surf-${version}-*" | wc -l)" -eq \
            "${#expected_assets[@]}"

          mkdir -p dist/packages
          find dist/packages -maxdepth 1 -type f -delete
          for asset in "${expected_assets[@]}"; do
            install -m 0644 "dist/$asset" dist/packages/
          done
          test "$(find dist/packages -maxdepth 1 -type f | wc -l)" -eq \
            "${#expected_assets[@]}"

          file dist/surf-${version}-linux-amd64/surf | grep -q 'x86-64'
          file dist/surf-${version}-linux-arm64/surf | grep -q 'ARM aarch64'
          file dist/surf-${version}-windows-amd64/surf.exe | grep -q 'PE32+.*x86-64'
          dist/surf-${version}-linux-amd64/surf version
          unzip -t "dist/surf-${version}-windows-amd64.zip"

          for arch in amd64 arm64; do
            binary="$RUNNER_TEMP/surf-darwin-$arch"
            tar -xOzf "dist/surf-${version}-darwin-$arch.tar.gz" \
              Surf.app/Contents/MacOS/surf > "$binary"
            (cd backend && go run ./tools/machoverify "$binary" "$arch" 12.0)
            tar -tzf "dist/surf-${version}-darwin-$arch.tar.gz" | \
              grep -qx 'Surf.app/Contents/Resources/Surf.icns'
          done

          sha256sum dist/packages/*

      - name: Generate and verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          protocol_version="$(tr -d '[:space:]' < PROTOCOL_VERSION)"
          client_deb="$(find dist/native -name '*.deb' -type f -print -quit)"

          VERSION="$version" PROTOCOL_VERSION="$protocol_version" \
            native/client/render-versioned-files.sh
          git diff --exit-code -- \
            native/client/control native/client/Resources/Info.plist

          (
            cd backend
            go run ./tools/updatemanifest ../dist/packages \
              "../$client_deb" "$version" "$protocol_version" ../update.json
          )
          jq -e \
            --arg version "$version" \
            --arg protocol "$protocol_version" \
            '.version == $version and .protocol == $protocol and
             (.assets | length) == 5 and (.packages | length) == 2' \
            update.json >/dev/null

          awk -v heading="## ${version} - " '
            index($0, heading) == 1 { found = 1 }
            found && /^## / && index($0, heading) != 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\nNative iOS and unified Linux, Windows, and macOS packages are attached. Launch `surf` for the desktop app or run `surf daemon` under a service manager for a headless backend.\n' >> release-notes.md

          sha256sum dist/native/*.deb update.json

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          native_asset="$(basename "$(find dist/native -name '*.deb' -type f -print -quit)")"
          if release_json="$(gh release view "$RELEASE_TAG" \
              --json isDraft,url 2>/dev/null)"; then
            test "$(jq -r '.isDraft' <<< "$release_json")" = "true" || {
              echo "$RELEASE_TAG is already published; refusing to replace it" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" \
              --title "Surf $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Surf $RELEASE_TAG" --notes-file release-notes.md
          fi

          assets=(
            CHANGELOG.md
            update.json
            "dist/native/$native_asset"
            "dist/packages/surf-${version}-linux-amd64.tar.gz"
            "dist/packages/surf-${version}-linux-amd64.AppImage"
            "dist/packages/surf-${version}-linux-arm64.tar.gz"
            "dist/packages/surf-${version}-windows-amd64.zip"
            "dist/packages/surf-${version}-windows-amd64-setup.exe"
            "dist/packages/surf-${version}-darwin-amd64.tar.gz"
            "dist/packages/surf-${version}-darwin-arm64.tar.gz"
          )
          expected_names=(
            CHANGELOG.md
            update.json
            "$native_asset"
            "surf-${version}-linux-amd64.tar.gz"
            "surf-${version}-linux-amd64.AppImage"
            "surf-${version}-linux-arm64.tar.gz"
            "surf-${version}-windows-amd64.zip"
            "surf-${version}-windows-amd64-setup.exe"
            "surf-${version}-darwin-amd64.tar.gz"
            "surf-${version}-darwin-arm64.tar.gz"
          )
          test "${#assets[@]}" -eq 10
          test "${#expected_names[@]}" -eq "${#assets[@]}"
          gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"

          draft="$(gh release view "$RELEASE_TAG" --json assets,isDraft,url)"
          test "$(jq -r '.isDraft' <<< "$draft")" = "true"
          expected_names_json="$(printf '%s\n' "${expected_names[@]}" | \
            jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
          actual_names_json="$(jq -c '[.assets[].name] | sort' <<< "$draft")"
          test "$actual_names_json" = "$expected_names_json" || {
            echo "draft release assets differ from the verified package set" >&2
            jq -r '.assets[].name' <<< "$draft" >&2
            exit 1
          }

          gh release edit "$RELEASE_TAG" --draft=false --latest

          published="$(gh release view "$RELEASE_TAG" \
            --json assets,isDraft,isPrerelease,url)"
          test "$(jq -r '.isDraft' <<< "$published")" = "false"
          test "$(jq -r '.isPrerelease' <<< "$published")" = "false"
          test "$(jq -c '[.assets[].name] | sort' <<< "$published")" = \
            "$expected_names_json"
          jq -r '.url, (.assets[].name)' <<< "$published"
