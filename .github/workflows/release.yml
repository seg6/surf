name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release metadata
        id: meta
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          protocol_version="$(tr -d '[:space:]' < PROTOCOL_VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION is required" >&2
            exit 1
          fi
          if [ -z "$protocol_version" ]; then
            echo "PROTOCOL_VERSION is required" >&2
            exit 1
          fi
          tag="v$version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "git tag ${GITHUB_REF_NAME} does not match VERSION $version" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "protocol_version=${protocol_version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Verify cross-platform backend builds
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/surf-backend-windows-amd64.exe" ./cmd/surf-backend
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/surf-backend-darwin-amd64" ./cmd/surf-backend
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/surf-backend-darwin-arm64" ./cmd/surf-backend

      - name: Build backend tarball
        run: make backend-dist

      - uses: actions/upload-artifact@v4
        with:
          name: surf-backend-${{ steps.meta.outputs.tag }}
          path: dist/surf-backend-*.tar.gz

      - name: Download native SDK
        run: make native-sdk

      - name: Build native build environment
        run: docker build -t surf-buildenv native/buildenv

      - name: Build native package
        run: make native-package

      - uses: actions/upload-artifact@v4
        with:
          name: surf-native-${{ steps.meta.outputs.tag }}
          path: native/client/packages/*.deb

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Surf ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            Native package and standalone Linux backend tarball attached.
          files: |
            native/client/packages/*.deb
            dist/surf-backend-*.tar.gz
