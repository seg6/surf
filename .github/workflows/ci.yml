name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test with race detector
        working-directory: backend
        run: go test -race ./...

  backend-packages:
    name: Backend package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build package
        run: make backend-dist BACKEND_GOOS=${{ matrix.goos }} BACKEND_GOARCH=${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: surf-backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  native:
    name: Native package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native SDK
        run: make native-sdk

      - name: Build native build environment
        run: docker build -t surf-buildenv native/buildenv

      - name: Build package
        run: make native-package

      - uses: actions/upload-artifact@v4
        with:
          name: surf-native-deb
          path: native/client/packages/*.deb
