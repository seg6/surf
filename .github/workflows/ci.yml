name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test with race detector
        working-directory: backend
        run: go test -race ./...

  packages:
    name: Surf ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: native
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: surf-native-deb
          path: dist/native

      - name: Build Surf package
        shell: bash
        run: |
          client_deb="$(find dist/native -name '*.deb' -type f -print -quit)"
          test -n "$client_deb"
          make surf-dist SURF_GOOS=${{ matrix.goos }} SURF_GOARCH=${{ matrix.goarch }} CLIENT_DEB="$client_deb"

      - name: Verify package
        shell: bash
        run: |
          test -n "$(find dist -type f \( -name surf -o -name surf.exe \) -print -quit)"
          test -z "$(find dist -type f \( -name surf-desktop -o -name surf-backend -o -name surf-desktop.exe -o -name surf-backend.exe \) -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: surf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/surf-*.tar.gz
            dist/surf-*.zip
          if-no-files-found: error

  native:
    name: Native package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated native metadata
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)" \
          PROTOCOL_VERSION="$(tr -d '[:space:]' < PROTOCOL_VERSION)" \
            native/client/render-versioned-files.sh
          git diff --exit-code -- native/client/control native/client/Resources/Info.plist

      - name: Download native SDK
        run: make native-sdk

      - name: Build native build environment
        run: docker build -t surf-buildenv native/buildenv

      - name: Build package
        run: make native-package

      - uses: actions/upload-artifact@v4
        with:
          name: surf-native-deb
          path: native/client/packages/*.deb
