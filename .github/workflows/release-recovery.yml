name: Release Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to publish
        required: true
        type: string
      release_run_id:
        description: Original Release workflow run containing the successful artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-recovery-${{ inputs.tag }}
  cancel-in-progress: false

# This workflow intentionally uses no actions. It is the recovery path for an
# Actions service incident that prevents runners from resolving `uses:` steps.
# The signed tag remains the source of truth; the workflow on main only provides
# the recovery machinery.
jobs:
  release:
    name: Recover ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - name: Fetch and verify signed release source
        shell: bash
        run: |
          set -euo pipefail

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "invalid release run ID: $SOURCE_RUN_ID" >&2
            exit 1
          }
          for command in curl gh git jq make sha256sum tar; do
            command -v "$command" >/dev/null || {
              echo "required command is unavailable: $command" >&2
              exit 1
            }
          done

          run_json="$(gh run view "$SOURCE_RUN_ID" \
            --json event,headSha,url,workflowName)"
          source_sha="$(jq -r '.headSha' <<< "$run_json")"
          workflow_name="$(jq -r '.workflowName' <<< "$run_json")"
          event="$(jq -r '.event' <<< "$run_json")"
          run_url="$(jq -r '.url' <<< "$run_json")"
          test "$workflow_name" = "Release" || {
            echo "run $SOURCE_RUN_ID belongs to '$workflow_name', not Release" >&2
            exit 1
          }
          test "$event" = "push" || {
            echo "run $SOURCE_RUN_ID was triggered by '$event', not a tag push" >&2
            exit 1
          }

          tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          tag_object_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_object_sha="$(jq -r '.object.sha' <<< "$tag_ref")"
          test "$tag_object_type" = "tag" || {
            echo "$RELEASE_TAG is not an annotated tag" >&2
            exit 1
          }

          tag_json="$(gh api "repos/$GH_REPO/git/tags/$tag_object_sha")"
          tag_name="$(jq -r '.tag' <<< "$tag_json")"
          tag_target_type="$(jq -r '.object.type' <<< "$tag_json")"
          tag_commit="$(jq -r '.object.sha' <<< "$tag_json")"
          tag_verified="$(jq -r '.verification.verified' <<< "$tag_json")"
          tag_verification_reason="$(jq -r '.verification.reason' <<< "$tag_json")"
          test "$tag_name" = "$RELEASE_TAG"
          test "$tag_target_type" = "commit" || {
            echo "$RELEASE_TAG does not point directly to a commit" >&2
            exit 1
          }
          test "$tag_verified" = "true" || {
            echo "$RELEASE_TAG signature is not verified: $tag_verification_reason" >&2
            exit 1
          }
          test "$tag_commit" = "$source_sha" || {
            echo "$RELEASE_TAG points to $tag_commit but $run_url built $source_sha" >&2
            exit 1
          }

          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git fetch --force --depth=1 origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$tag_commit"
          test "$(git rev-parse HEAD)" = "$tag_commit"

          version="$(tr -d '[:space:]' < VERSION)"
          protocol_version="$(tr -d '[:space:]' < PROTOCOL_VERSION)"
          test "$RELEASE_TAG" = "v$version" || {
            echo "$RELEASE_TAG does not match VERSION $version" >&2
            exit 1
          }
          test -n "$protocol_version"
          git diff --exit-code

          echo "Verified $RELEASE_TAG at $tag_commit against $run_url"

      - name: Recover and verify release packages
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          protocol_version="$(tr -d '[:space:]' < PROTOCOL_VERSION)"
          mkdir -p dist/source-artifacts dist/packages
          gh run download "$SOURCE_RUN_ID" --dir dist/source-artifacts

          copy_one() {
            local pattern="$1"
            local -a matches=()
            mapfile -t matches < <(find dist/source-artifacts -type f \
              -name "$pattern" -print)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "expected one source artifact matching $pattern, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
            install -m 0644 "${matches[0]}" dist/packages/
          }

          copy_one "space.seg6.surf_${version}-*_iphoneos-arm.deb"
          copy_one "surf-${version}-linux-arm64.tar.gz"
          copy_one "surf-${version}-windows-amd64.zip"
          copy_one "surf-${version}-windows-amd64-setup.exe"
          copy_one "surf-${version}-darwin-amd64.tar.gz"
          copy_one "surf-${version}-darwin-amd64.dmg"
          copy_one "surf-${version}-darwin-arm64.tar.gz"
          copy_one "surf-${version}-darwin-arm64.dmg"

          mapfile -t client_debs < <(find dist/packages -maxdepth 1 \
            -name '*.deb' -type f -print)
          test "${#client_debs[@]}" -eq 1
          client_deb="${client_debs[0]}"

          required_go="$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          test -n "$required_go"
          if ! command -v go >/dev/null 2>&1 || \
              [ "$(go env GOVERSION 2>/dev/null || true)" != "go$required_go" ]; then
            go_filename="go${required_go}.linux-amd64.tar.gz"
            go_archive="$RUNNER_TEMP/$go_filename"
            go_checksum="$(curl -fsSL 'https://go.dev/dl/?mode=json&include=all' |
              jq -r --arg filename "$go_filename" '
                .[] | .files[] | select(.filename == $filename) | .sha256
              ')"
            [[ "$go_checksum" =~ ^[0-9a-f]{64}$ ]] || {
              echo "could not resolve checksum for $go_filename" >&2
              exit 1
            }
            curl -fL "https://go.dev/dl/$go_filename" -o "$go_archive"
            printf '%s  %s\n' "$go_checksum" "$go_archive" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/surf-go"
            tar -xzf "$go_archive" -C "$RUNNER_TEMP/surf-go" \
              --strip-components=1
            export PATH="$RUNNER_TEMP/surf-go/bin:$PATH"
          fi
          test "$(go env GOVERSION)" = "go$required_go"
          go version

          appimagetool="$RUNNER_TEMP/appimagetool"
          curl -fL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$appimagetool"
          chmod +x "$appimagetool"
          export APPIMAGETOOL="$appimagetool"

          make surf-dist SURF_GOOS=linux SURF_GOARCH=amd64 \
            CLIENT_DEB="$client_deb"
          install -m 0644 "dist/surf-${version}-linux-amd64.tar.gz" \
            dist/packages/
          install -m 0755 "dist/surf-${version}-linux-amd64.AppImage" \
            dist/packages/

          expected_assets=(
            "space.seg6.surf_${version}-1_iphoneos-arm.deb"
            "surf-${version}-linux-amd64.tar.gz"
            "surf-${version}-linux-amd64.AppImage"
            "surf-${version}-linux-arm64.tar.gz"
            "surf-${version}-windows-amd64.zip"
            "surf-${version}-windows-amd64-setup.exe"
            "surf-${version}-darwin-amd64.tar.gz"
            "surf-${version}-darwin-amd64.dmg"
            "surf-${version}-darwin-arm64.tar.gz"
            "surf-${version}-darwin-arm64.dmg"
          )
          for asset in "${expected_assets[@]}"; do
            test -s "dist/packages/$asset" || {
              echo "missing release asset: $asset" >&2
              exit 1
            }
          done
          test "$(find dist/packages -maxdepth 1 -type f | wc -l)" -eq \
            "${#expected_assets[@]}"

          VERSION="$version" PROTOCOL_VERSION="$protocol_version" \
            native/client/render-versioned-files.sh
          git diff --exit-code -- \
            native/client/control native/client/Resources/Info.plist

          (
            cd backend
            go run ./tools/updatemanifest ../dist/packages \
              "../$client_deb" "$version" "$protocol_version" ../update.json
          )
          jq -e \
            --arg version "$version" \
            --arg protocol "$protocol_version" \
            '.version == $version and .protocol == $protocol' \
            update.json >/dev/null

          awk -v heading="## ${version} - " '
            index($0, heading) == 1 { found = 1 }
            found && /^## / && index($0, heading) != 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          printf '\nNative iOS and unified Linux, Windows, and macOS packages are attached. Launch `surf` for the desktop app or run `surf daemon` under a service manager for a headless backend.\n' >> release-notes.md

          sha256sum dist/packages/* update.json

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail

          if release_json="$(gh release view "$RELEASE_TAG" \
              --json isDraft,isPrerelease,url 2>/dev/null)"; then
            test "$(jq -r '.isDraft' <<< "$release_json")" = "true" || {
              echo "$RELEASE_TAG is already published; refusing to replace it" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" \
              --title "Surf $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Surf $RELEASE_TAG" --notes-file release-notes.md
          fi

          mapfile -t package_assets < <(find dist/packages -maxdepth 1 \
            -type f -print | sort)
          test "${#package_assets[@]}" -eq 10
          gh release upload "$RELEASE_TAG" --clobber \
            CHANGELOG.md update.json "${package_assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false --latest

          published="$(gh release view "$RELEASE_TAG" \
            --json assets,isDraft,isPrerelease,url)"
          test "$(jq -r '.isDraft' <<< "$published")" = "false"
          test "$(jq -r '.isPrerelease' <<< "$published")" = "false"
          test "$(jq '.assets | length' <<< "$published")" -eq 12
          jq -r '.url, (.assets[].name)' <<< "$published"
