<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="wrp">
<link rel="apple-touch-icon-precomposed" sizes="57x57" href="/icon-57.png">
<link rel="apple-touch-icon-precomposed" sizes="72x72" href="/icon-72.png">
<link rel="apple-touch-icon-precomposed" sizes="114x114" href="/icon-114.png">
<link rel="apple-touch-icon-precomposed" sizes="144x144" href="/icon-144.png">
<link rel="apple-touch-icon" href="/icon-72.png">
<title>wrp</title>
<script>window.__T = '__WS_TOKEN__'; window.__V = '__CLIENT_VERSION__';</script>
<link rel="stylesheet" href="/style.css?v=__CLIENT_VERSION__">
</head>
<body>
  <div id="bar">
    <button class="btn nav" id="back" disabled>&#8249;</button>
    <button class="btn nav" id="fwd" disabled>&#8250;</button>
    <div id="omnibox">
      <div id="progress"></div>
      <img id="siteicon" alt="">
      <form id="urlform" action="#"><input id="url" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search or enter address"></form>
      <button class="inbtn" id="star">&#9734;</button>
      <button class="inbtn" id="reload">&#8635;</button>
      <div id="sugg"></div>
    </div>
    <button class="btn" id="dotcom">.com</button>
    <button class="btn" id="kbd">&#9000;</button>
    <button class="btn" id="menu">&#8943;</button>
    <button class="btn" id="fs">&#8689;</button>
  </div>
  <div id="findbar">
    <input id="findq" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Find in page">
    <button class="btn" id="findprev">&#8249;</button>
    <button class="btn" id="findnext">&#8250;</button>
    <button class="btn" id="findclose">Done</button>
  </div>
  <div id="tabs"></div>
  <div id="debug" class="off"></div>
  <div id="wrap"><canvas id="screen" width="1024" height="768"></canvas></div>
  <div id="dragring"></div>
  <div id="fsdot">&#8690;</div>
  <div id="catcher"></div>
  <div id="popover"></div>
  <div id="shade"></div>
  <div id="panel"></div>
  <input id="hidden" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="hint">Connecting&hellip;</div>
  <script src="/app.js?v=__CLIENT_VERSION__"></script>
</body>
</html>
